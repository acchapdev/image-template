# Preselect the mango session on a fresh install.
# The Dux greeter remembers each user's last session in memory.json; with no
# memory it picks whichever session file loaded first, which is not stable.
# 'f' only writes the file if it does not exist, so later choices are kept.
# (/var/cache/dms-greeter itself comes from dux-greeter's own tmpfiles.d entry.)
d /var/cache/dms-greeter/.local 0750 greeter greeter -
d /var/cache/dms-greeter/.local/state 0750 greeter greeter -
f /var/cache/dms-greeter/.local/state/memory.json 0644 greeter greeter - {"lastSessionId":"/usr/share/wayland-sessions/mango.desktop","lastSessionDesktopId":"mango.desktop"}
