# owlOS: portal backends for mango sessions (XDG_CURRENT_DESKTOP=mango:wlroots).
# Overrides /usr/share/xdg-desktop-portal/mango-portals.conf from mangowm, which
# leaves GlobalShortcuts and InputCapture unset. gtk doesn't implement them, so
# xdg-desktop-portal fell back to the Hyprland backend (UseIn=wlroots), which
# can't work under mango and crashed. "none" turns those two portals off.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Inhibit=none
org.freedesktop.impl.portal.GlobalShortcuts=none
org.freedesktop.impl.portal.InputCapture=none
