# Anaconda ISO config, used by `just build-iso` and .github/workflows/build-disk.yml.
# owlOS ships no GNOME initial-setup, so the installer itself must create the first
# user and set the timezone/network: keep the Users, Timezone and Network modules on.
[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/acchapdev/owlos:latest
# Anaconda writes its own default target into /etc (multi-user.target for a text
# install), overriding the image's graphical.target, so greetd never starts.
# %post runs after that, inside the installed system, so set it back here.
systemctl set-default graphical.target
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
