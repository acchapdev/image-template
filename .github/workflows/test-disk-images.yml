---
# TEMPORARY (branch fix-disk-f44): find out why build-disk.yml fails on owlOS.
# Round 1 showed: Fedora 45 can't depsolve the ISO at all (bootc-image-builder
# isn't ready for F45), and every job fails with osbuild
# "mount: ... permission denied" on the ubuntu-26.04 runner.
# Round 2: ubuntu-26.04 fails even with AppArmor relaxed; ubuntu-24.04 builds qcow2.
# Round 3 (this file): ISO on F44 and F45, qcow2 on F45, all on ubuntu-24.04.
# Nothing is pushed. Remove this workflow once disk images build.
name: Test disk images

on:
  push:
    branches:
      - fix-disk-f44
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.disk-type }} / base-main:${{ matrix.base }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { disk-type: anaconda-iso, runner: ubuntu-24.04, fix: none, base: "44" }
          - { disk-type: anaconda-iso, runner: ubuntu-24.04, fix: none, base: latest }
          - { disk-type: qcow2, runner: ubuntu-24.04, fix: none, base: latest }
    permissions:
      contents: read
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Runner info
        run: |
          uname -r
          podman --version
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.apparmor_restrict_unprivileged_unconfined 2>/dev/null || true

      - name: Allow user namespaces under AppArmor
        if: matrix.fix == 'userns-sysctl'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true

      - name: Build owlOS image (rootful, so bootc-image-builder can see it)
        run: |
          sudo podman build --pull=newer --build-arg BASE_TAG=${{ matrix.base }} \
            --tag localhost/owlos:test --file Containerfile .

      - name: Build ${{ matrix.disk-type }}
        run: |
          CONFIG=disk_config/disk.toml
          [[ "${{ matrix.disk-type }}" == "anaconda-iso" ]] && CONFIG=disk_config/iso.toml
          EXTRA=()
          [[ "${{ matrix.fix }}" == "apparmor-unconfined" ]] && EXTRA+=(--security-opt apparmor=unconfined)
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t "${EXTRA[@]}" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "${PWD}/output:/output" \
            -v "${PWD}/${CONFIG}:/config.toml:ro" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build --type ${{ matrix.disk-type }} --use-librepo=True --output /output \
            localhost/owlos:test
          sudo find output -maxdepth 3 -type f -exec ls -lh {} +
